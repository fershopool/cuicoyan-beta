name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
      SITE_BASE: ${{ vars.SITE_BASE || '/' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Build
        working-directory: frontend
        env:
          VITE_BASE_URL: ${{ env.SITE_BASE }}
        run: npm run build
      # prepare-dist.mjs escribe la salida en la raiz del repo (dist/), no en frontend/dist
      - name: Write runtime config
        env:
          CFG_URL: ${{ env.SUPABASE_URL }}
          CFG_KEY: ${{ env.SUPABASE_ANON_KEY }}
        run: |
          test -f dist/index.html
          {
            printf 'window.CUICOYAN_CONFIG = {supabaseUrl: '
            jq -nr --arg v "$CFG_URL" '$v | tojson' | tr -d '\n'
            printf ', supabaseAnonKey: '
            jq -nr --arg v "$CFG_KEY" '$v | tojson' | tr -d '\n'
            printf '};\n'
          } > dist/config.js
          cp dist/index.html dist/404.html
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
